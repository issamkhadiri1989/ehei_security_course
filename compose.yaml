services:
    franken_php:
        build:
            context: ./infra/
            dockerfile: ./frankenphp/Dockerfile
        volumes:
            - ./project:/app
        expose:
            - "80"                      # ← était 443
        environment:
            SERVER_NAME: "http://:80"   # ← HTTP simple, pas HTTPS
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.group1.rule=Host(`group1.ehei.localhost`)"
            - "traefik.http.routers.group1.entrypoints=websecure"
            - "traefik.http.routers.group1.tls=true"
            - "traefik.http.services.group1.loadbalancer.server.port=80"    # ← était 443
            - "traefik.http.services.group1.loadbalancer.server.scheme=http" # ← était https
            - "traefik.docker.network=proxy-net"

        networks:
            - internal_network
            - proxy-net                            # ← ajout : Traefik doit voir ce container

    database:
        image: mysql
        platform: linux/x86_64
        command: --innodb-use-native-aio=${INNODB_USE_NATIVE_AIO:-1} --sql_mode=${SQL_MODE:-"ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"}
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: app
        volumes:
            - mysql_user:/var/lib/mysql:delegated
        networks:
            - internal_network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5
        environment:
            PMA_HOST: database
        depends_on:
            - database
        networks:
            - internal_network
        volumes:
            - db_admin_data:/var/www/html

volumes:
    db_admin_data:
    mysql:
    mysql_user:

networks:
    internal_network:
        name: internal_network
    proxy-net:                                     # ← ajout
        name: proxy-net
        external: true
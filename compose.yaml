services:
    # FrankenPHP
    franken_php:
        build:
            context: ./infra/
            dockerfile: ./frankenphp/Dockerfile
        volumes:
            - ./project:/app
        ports:
            - "80:80"
            - "443:443"
        networks:
            - internal_network

    # Database server
    database:
        image: mysql
        platform: linux/x86_64
        command: --innodb-use-native-aio=${INNODB_USE_NATIVE_AIO:-1} --sql_mode=${SQL_MODE:-"ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"}
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: app
        ports:
            - "33060:3306"
        volumes:
            - mysql_user:/var/lib/mysql:delegated
        networks:
            - internal_network

    # PhpMyAdmin for database administration. Accessible with http://localhost:9002
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5
        environment:
            PMA_HOST: database
        ports:
            - "9002:80"
        depends_on:
            - database
        networks:
            - internal_network
        volumes:
            - db_admin_data:/var/www/html

    # local SMTP server for emailing. The UI interface is accessible with http://localhost:1080.
    # To send email using SMTP, use the port 1025
    mailcatcher:
        networks:
            - internal_network
        image: yappabe/mailcatcher
        ports:
            - '1025:1025'
            - '1080:1080'
volumes:
    db_admin_data:
    mysql:
    mysql_user:

networks:
    internal_network:
        name: internal_network
